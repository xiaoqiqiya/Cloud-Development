name: Build Custom Base Image

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile.base.custom'
      - 'Dockerfile.custom'
      - 'custom-base/*.py'
      - 'custom-base/*.sh'
      - 'agent/**'
      - 'base/**'
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile.base.custom'
      - 'Dockerfile.custom'
      - 'custom-base/*.py'
      - 'custom-base/*.sh'
      - 'agent/**'
      - 'base/**'
  workflow_dispatch:
    inputs:
      image_tag:
        description: '独立标签：base-custom 或 base-custom-名称'
        type: string
        default: base-custom
      install_go:
        description: 'Go + gopls + govulncheck'
        type: boolean
        default: true
      install_rust:
        description: 'Rust + Clippy + rustfmt + rust-src'
        type: boolean
        default: true
      install_bun:
        description: 'Bun / bunx（Node/npm/pnpm 始终保留）'
        type: boolean
        default: true
      install_docker:
        description: 'Docker CE + Buildx + Compose（音视频也会自动安装）'
        type: boolean
        default: true
      install_gh:
        description: 'GitHub CLI'
        type: boolean
        default: true
      install_node_tools:
        description: 'TypeScript / ESLint / Prettier / esbuild / Vitest 等'
        type: boolean
        default: false
      install_java:
        description: 'Java 21 + Gradle（Android、Flutter、逆向也会自动安装）'
        type: boolean
        default: false
      install_android:
        description: 'Android SDK（自动安装 Java）'
        type: boolean
        default: false
      install_flutter:
        description: 'Flutter（自动安装 Android SDK 和 Java）'
        type: boolean
        default: false
      install_browser:
        description: 'Chrome + Playwright MCP + Python Playwright / Scrapling'
        type: boolean
        default: false
      install_office:
        description: 'LibreOffice / 文档转换 / Office 的 Node 和 Python 包'
        type: boolean
        default: false
      install_reverse:
        description: 'APK 工具 / radare2 / Anything Analyzer / Python 逆向工具（自动安装 Java）'
        type: boolean
        default: false
      install_windows:
        description: 'Wine + NSIS + Windows Electron 缓存'
        type: boolean
        default: false
      install_media:
        description: '音视频：FFmpeg / Hyperframes / whisper / CPU torch（自动安装浏览器和 Docker）'
        type: boolean
        default: true
      install_python_packages:
        description: 'Python Web / 数据库 / AI SDK 常用包（不含模型）'
        type: boolean
        default: false
      install_cloud:
        description: 'Wrangler / EAS / 飞书 CLI 与 MCP'
        type: boolean
        default: false
      install_codegraph:
        description: 'CodeGraph CLI / MCP'
        type: boolean
        default: false
      install_clash:
        description: 'mihomo / Clash TUN 工具'
        type: boolean
        default: false
      prewarm_go:
        description: '预下载原 Go 项目依赖（自动安装 Go，明显增大镜像）'
        type: boolean
        default: false
      install_codex:
        description: 'Codex CLI（AI Agent 默认仅保留这一项）'
        type: boolean
        default: true
      install_claude_code:
        description: 'Claude Code + ccline + 现有补丁'
        type: boolean
        default: false
      install_codex_security:
        description: 'Codex Security CLI'
        type: boolean
        default: false
      install_antigravity:
        description: 'Antigravity CLI（agy）'
        type: boolean
        default: false
      install_serena:
        description: 'Serena MCP（含常驻服务，取消时同步关闭自启与健康检查）'
        type: boolean
        default: false
  workflow_call:
    inputs:
      image_tag:
        description: '用于发布串行控制的 custom 基础标签'
        required: true
        type: string
      config_json:
        description: '上次成功发布的组件勾选配置'
        required: true
        type: string
      versions_json:
        description: '本次检测到的已启用组件版本'
        required: true
        type: string

permissions:
  contents: write
  packages: write

# 同一标签的手动发布和自动更新串行运行。
concurrency:
  group: custom-base-${{ inputs.image_tag || github.ref }}
  cancel-in-progress: false

jobs:
  build-base-custom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check component options and prepare build
        id: options
        env:
          INPUTS_JSON: ${{ toJSON(inputs) }}
          REUSABLE_INPUTS_JSON: ${{ inputs.config_json }}
          VERSIONS_JSON: ${{ inputs.versions_json }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 custom-base/check.py --self-test
          python3 custom-base/test-update.py
          bash custom-base/test-healthcheck.sh
          python3 custom-base/update.py --prepare

      # 沿用旧 Base workflow 的空间清理、Buildx、GHCR 登录和 registry 缓存。
      - name: Free runner disk space
        run: |
          AVAIL_GB=$(df -BG --output=avail / | awk 'NR == 2 { gsub(/G/, ""); print }')
          if [ "${AVAIL_GB}" -lt 40 ]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
            docker system prune -af --volumes
          fi
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          cleanup: false

      - name: Log in to Container Registry
        if: steps.options.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally push custom base and agents
        id: build
        env:
          BAKE_FILE: ${{ steps.options.outputs.bake_file }}
          PUBLISH_CUSTOM: ${{ steps.options.outputs.publish }}
        run: |
          flags=()
          if [ "$PUBLISH_CUSTOM" = true ]; then flags+=(--push); fi
          docker buildx bake --file "$BAKE_FILE" --metadata-file "$RUNNER_TEMP/custom-metadata.json" "${flags[@]}"

      - name: Record published image
        if: steps.options.outputs.publish == 'true'
        env:
          IMAGE: ${{ steps.options.outputs.image }}
          TAG: ${{ steps.options.outputs.tag }}
          APP_TAG: ${{ steps.options.outputs.app_tag }}
        run: |
          BASE_DIGEST=$(jq -er '.base["containerimage.digest"]' "$RUNNER_TEMP/custom-metadata.json")
          APP_DIGEST=$(jq -er '.custom["containerimage.digest"]' "$RUNNER_TEMP/custom-metadata.json")
          printf '\n基础镜像：`%s:%s@%s`\n' "$IMAGE" "$TAG" "$BASE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          printf '\n应用镜像（含所选 Agent）：`%s:%s@%s`\n' "$IMAGE" "$APP_TAG" "$APP_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          printf '\n本次组合固定标签：`%s:%s-%s-%s`\n' "$IMAGE" "$APP_TAG" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_STEP_SUMMARY"

      - name: Save successful custom configuration and versions
        if: steps.options.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 custom-base/update.py --record
